host: ""
port: 8317

# Directory to store OAuth tokens
auth-dir: "~/.auth2api"

# API keys for client authentication (clients use these to access this proxy)
api-keys:
  - "your-api-key-here"

# Maximum JSON request body size
body-limit: "200mb"

# Upstream request timeouts
timeouts:
  messages-ms: 120000         # non-stream /v1/messages timeout
  stream-messages-ms: 600000  # stream /v1/messages timeout, suitable for Claude Code long tasks
  count-tokens-ms: 30000      # /v1/messages/count_tokens timeout

# Per-request call statistics. Aggregated by:
#   - client (sha256(api-key))
#   - upstream account (provider + email)
#   - api endpoint x model x provider
# Events are appended to <auth-dir>/stats.jsonl and replayed on startup.
# Query the live snapshot via GET /admin/stats (requires API key).
stats:
  enabled: true

# Debug logging level:
# off = no extra logs
# errors = upstream/network failure details
# verbose = errors + per-request access logs
debug: "off"

# Request fingerprinting — controls how auth2api mimics Claude Code CLI
# These settings affect the User-Agent, billing header, and fingerprint
cloaking:
  # CLI version to impersonate (default: the runtime's, 2.1.280 in 0.9.29).
  # Leave unset: Anthropic version-gates new models ("Claude Code X does not
  # support this model"), and a pinned value goes stale.
  # This affects User-Agent and the fingerprint in billing-header
  # cli-version: "2.1.280"

  # Entrypoint for billing attribution (default: cli)
  # Claude Code uses: cli, mcp, sdk, etc.
  entrypoint: "cli"

  # Codex (ChatGPT) provider — protocol-required header strings.
  # NOT identity faking; these mirror what the official codex CLI sends.
  # The cli-version drives BOTH the User-Agent suffix and the explicit
  # `version` HTTP header — the backend version-gates some models on it
  # ("requires a newer version of Codex" 400, or "model is not supported when
  # using Codex with a ChatGPT account" when a model's minimal_client_version
  # is higher). Leave cli-version unset to follow the runtime default, which is
  # bumped with each release; set it only to override that default.
  codex:
    # Full User-Agent string, takes precedence over the components below.
    # user-agent: "codex_cli_rs/0.163.0 (linux; x86_64)"
    originator: "codex_cli_rs"
    # cli-version: "0.163.0"
    # Set only if the upstream begins requiring an OpenAI-Beta header.
    # openai-beta: "responses=experimental"

  # Cursor provider — experimental, reverse-engineered, and not official.
  # Chat goes to agent.v1.AgentService/Run on agent.api5.cursor.sh. The client
  # version is read from Cursor's public update feed (refreshed every 6 h);
  # pinning one makes Cursor refuse the proxy once that release is retired
  # ("Your version of Cursor is no longer supported").
  cursor:
    client-type: "ide"
    # client-version: "3.29.9"   # pin only to debug; pair it with client-commit
    # client-commit: "306d153d51d714882ab7b1bc49649cab624e8a31"
    # agent-service-url: "https://agent.api5.cursor.sh"
    # chat-api: "chat"   # legacy ChatService path (Auto/composer refused there)
    # Hosts for the legacy chat path and the model list; agent-base-url is an alias.
    api-base-url: "https://api2.cursor.sh"

# Models listed on /v1/models. `*` is a wildcard, a leading `!` excludes. Empty = list everything.
# This only hides models from the list; a request naming a hidden model is still served.
# expose-models:
#   - "gemini-3.8-*"
#   - "ag/claude-*"
#   - "!*-low"
expose-models: []

# Ollama-compatible facade (/api/chat, /api/generate, /api/tags...). Off by default.
ollama-facade: false
