name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke-check startup with an empty auth directory
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/oauth2api-smoke"
          mkdir -p "$smoke_dir/auth"
          cat > "$smoke_dir/config.yaml" <<EOF
          auth-dir: "$smoke_dir/auth"
          api-keys:
            - "ci-smoke-key"
          EOF
          set +e
          node dist/index.js --config="$smoke_dir/config.yaml" > "$smoke_dir/output.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 1 ]] || ! grep -Fq "No accounts found." "$smoke_dir/output.log"; then
            cat "$smoke_dir/output.log"
            echo "Built executable did not reach the expected empty-auth startup path." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: oauth2api-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: oauth2api-dist
          path: dist
      - name: Validate tag and install production dependencies
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$version" != "$package_version" ]]; then
            echo "Release tag must be vX.Y.Z and match package.json version ($package_version)." >&2
            exit 1
          fi
          npm ci --omit=dev
      - name: Reject architecture-specific native dependencies
        shell: bash
        run: |
          set -euo pipefail
          native_paths="$(find node_modules \( -name '*.node' -o -name node-gyp -o -name binding.gyp -o -name prebuilds \) -print)"
          if [[ -n "$native_paths" ]]; then
            echo "Native Node binding detected; an architecture-independent bundle is unsafe." >&2
            echo "A bundle by architecture would be required before publishing:" >&2
            printf '%s\n' "$native_paths" >&2
            exit 1
          fi
      - name: Assemble and checksum universal bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="oauth2api-v${version}.tar.gz"
          bundle_dir="$RUNNER_TEMP/oauth2api-bundle"
          mkdir -p "$bundle_dir"
          cp -a dist node_modules package.json config.example.yaml README.md "$bundle_dir/"
          if [[ -f LICENSE ]]; then cp -a LICENSE "$bundle_dir/"; fi
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$name" -C "$bundle_dir" .
          sha256sum "$name" > "$name.sha256"
          echo "archive=$name" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.bundle.outputs.archive }}" "${{ steps.bundle.outputs.archive }}.sha256" --verify-tag --generate-notes
